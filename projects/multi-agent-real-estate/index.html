        "articleBody": "My dissertation, titled “A Multi-Agent Framework Powered by Language Models for Real Estate Intelligence Analysis”, explored how far small open language models can be pushed in complex analytical workflows. Translates natural-language questions into spatial and temporal data operations and returns grounded SQL, maps, charts and narratives. Built on structured shared state, tool use, database grounding, review mechanisms and targeted fine-tuning of small open models. Designed the evaluation pipeline and benchmark used to measure the system end to end. One of the main conclusions was that small open models can operate the complete workflow when embedded in a multi-agent system with structured state, tool use, database grounding, review mechanisms, and targeted fine-tuning. At the same time, the work showed that model constraints can be reduced through system design, but not fully removed by orchestration or fine-tuning. Pipeline question → planner → sql agent / geo agent / narrative agent → shared state → map / chart / narrative",
