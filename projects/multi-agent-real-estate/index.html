        "articleBody": "My dissertation, titled \"A Multi-Agent Framework Powered by Language Models for Real Estate Intelligence Analysis\", started from a simple but very practical question: Can a person ask a real estate market question in natural language and receive a grounded answer with SQL, maps, charts, and an analytical narrative, without manually writing geospatial queries or using GIS tools? The project became AgenticSIR, a research prototype for conversational analysis of Portuguese real estate data. It connects natural-language questions to a PostGIS database, decomposes the request into analytical tasks, generates and reviews SQL, produces map and chart artifacts, and writes a final narrative grounded in the executed data. The more interesting part, however, was not only building the application. It was testing how far small open language models could be pushed when embedded inside a structured multi-agent system. I proposed the theme to Confidencial Imobiliário, a Portuguese real estate intelligence company, in April 2025. Due to FEUP’s calendar, the practical work was carried out between February and June 2026. The final defense took place in July. The Problem: Real Estate Data Is Rich, but Hard to Ask Questions Of Real estate datasets contain evidence that matters: prices, rents, contract dates, property characteristics, locations, administrative boundaries, and market trends over time. But extracting that evidence usually requires several layers of technical knowledge: SQL for querying structured records GIS concepts for working with geography PostGIS functions for spatial filtering and aggregation data-model knowledge for joining the right tables visualization tools for turning results into maps and charts This creates a gap between the way people think and the way analytical systems usually work. A market analyst, policymaker, investor, or real estate professional might naturally ask: Which parishes in Porto had the highest increase in rental prices last quarter? But answering that question correctly may require entity resolution, spatial filters, time windows, joins, aggregations, and visualization logic. AgenticSIR was built to explore whether language models could bridge that gap: not by replacing the database, but by acting as an interface to it. What AgenticSIR Does At a high level, AgenticSIR translates a user question into a sequence of grounded analytical operations: A user asks a question in natural language. The system resolves locations, creates a plan, generates SQL queries, reviews them, executes them against a PostGIS database, saves successful result sets as Parquet artifacts, and then uses those artifacts to produce maps, charts, and a final explanation. The final response can include: a textual analysis Plotly charts Kepler.gl map layers references to the data artifacts used follow-up context from previous questions This was not designed as a chatbot that happens to know about real estate. It was designed as an analytical workflow in which language models are only one part of the system. Why a Multi-Agent System? One of the central design decisions was to avoid asking a single model to solve the whole problem in one response. That may work for demos, but it hides failures. A final answer can sound convincing even if the system resolved the wrong location, generated the wrong query, used the wrong aggregation, or summarized results that do not actually answer the question. So AgenticSIR separates the workflow into specialized stages: Entity Resolution Agent identifies geographic references such as municipalities, parishes, streets, postal codes, and radius-based locations. Planner Agent decomposes the user request into structured data tasks. SQL Agent generates PostGIS SQL for each task. Review Agent checks whether the SQL is safe, executable, and semantically aligned with the task. Map Agent builds Kepler.gl layer configurations from successful data outputs. Chart Agent builds Plotly chart configurations. Narrator Agent writes the final answer using executed data artifacts rather than model memory. This separation makes the system easier to observe and evaluate. Instead of asking only \"was the final answer good?\", the evaluation can ask: Was the location resolved correctly? Did the planner request the right evidence? Did the SQL execute? Did it answer the intended question? Did the visual output represent the data correctly? Was the final narrative grounded? That distinction became one of the most important parts of the dissertation. The Architecture The backend was built with Django, Django REST Framework, Celery, Redis, LangGraph, and PostgreSQL/PostGIS. The frontend was built with React, Vite, Kepler.gl, Plotly, and DuckDB WASM. When a user submits a message, the request first enters the Django API. A Celery task performs location resolution. If a location is ambiguous, the frontend can show a human-in-the-loop confirmation step. Once the location context is confirmed or no location…",
