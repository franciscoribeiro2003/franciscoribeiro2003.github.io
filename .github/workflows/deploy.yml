name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Page content is fetched from PocketBase at runtime and needs no deploy. The
  # nightly run exists only to refresh the baked <head> — the SEO copy, Open
  # Graph tags and sitemap that a crawler reads before any JavaScript runs.
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate runtime config
        env:
          POCKETBASE_URL: ${{ secrets.POCKETBASE_URL }}
          MEDIA_BASE_URL: ${{ secrets.MEDIA_BASE_URL }}
        run: |
          cat > js/config.js <<EOF
          // Generated by CI — do not edit.
          window.APP_CONFIG = {
            pocketbaseUrl: "${POCKETBASE_URL}",
            mediaBaseUrl: "${MEDIA_BASE_URL}",
            satelliteTiles: null
          };
          EOF
          if [ -z "$POCKETBASE_URL" ]; then
            echo "::warning::POCKETBASE_URL is empty — the guestbook will be read-only."
          fi

      - name: Prerender the SEO head from PocketBase
        env:
          POCKETBASE_URL: ${{ secrets.POCKETBASE_URL }}
        # Only the <head> is baked: title, description, canonical, Open Graph,
        # Twitter cards, JSON-LD, sitemap.xml and robots.txt, plus one shell
        # per post. Page content is fetched from PocketBase at runtime.
        #
        # The committed <head> blocks are empty on purpose — no content lives
        # in this repo — so this step FAILING must fail the deploy. Publishing
        # without it would ship pages with no title or description. It retries
        # three times first, because the backend scales to zero and the first
        # request after an idle period pays a cold start.
        run: node tools/prerender.mjs --origin "https://franciscoribeiro2003.github.io"

      - name: Stamp the build date
        run: |
          DATE=$(date -u "+%b %Y")
          # data-updated drives the "Updated …" line in the footer.
          find . -name '*.html' -not -path './node_modules/*' \
            -exec sed -i "s/data-updated=\"[^\"]*\"/data-updated=\"$DATE\"/g" {} +

      # The deploy action commits the folder to `gh-pages` with `git add`, and
      # it copies `.gitignore` along with everything else — so the repo's
      # ignore rules decide what reaches the live site. Every generated file is
      # deliberately gitignored (that is how the repo stays free of content),
      # which meant js/config.js, sitemap.xml, robots.txt and every per-post
      # page were silently missing from production while the tracked files
      # published fine.
      #
      # This replaces it, in the CI checkout only, with the two rules that
      # genuinely must never be published. Nothing here touches the repository.
      - name: Let the generated files reach the published branch
        run: printf '.DS_Store\nnode_modules/\n' > .gitignore

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: .
          branch: gh-pages
          clean: true
          clean-exclude: |
            .nojekyll
