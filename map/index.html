    (function () {
      try {
        var t = localStorage.getItem("fr:theme");
        if (t && t !== "system") document.documentElement.setAttribute("data-theme", t);

<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <div class="page page--app">
    <main id="main" class="map-split">

      <!-- ---------- left: travel journal ---------- -->
      <section class="journal" aria-label="Trips">
        <div class="chips" id="mode-filters" role="group" aria-label="Transport mode"></div>

        <div class="journal__head">
          <h2 class="t-caps muted" data-i18n="map.trips">Trips</h2>
          <span class="t-mono-xs muted" id="trip-count">—</span>
        </div>

        <div class="trip-list" id="trip-list"></div>

        <hr class="rule">

        <article class="story" id="story" aria-live="polite"></article>
      </section>

      <!-- ---------- right: globe ---------- -->
      <section class="globe-panel" aria-label="Interactive globe">
        <div id="globe"></div>

        <div class="globe-overlay globe-overlay--caption">
          <p class="globe-caption__title" id="globe-title">all routes</p>
          <p class="globe-caption__meta" id="globe-meta">—</p>
        </div>

        <p class="globe-overlay globe-overlay--hint" data-i18n="map.hint">
          drag to rotate · scroll to zoom
        </p>

        <div class="globe-overlay globe-overlay--controls">
          <button type="button" id="zoom-in" aria-label="Zoom in">+</button>
          <button type="button" id="zoom-out" aria-label="Zoom out">−</button>
          <button type="button" id="reset-view" aria-label="Show all routes">⊙</button>
        </div>
      </section>
    </main>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/5.6.0/maplibre-gl.js"></script>
  <script type="module" src="/js/pages/map.js"></script>
</body>
