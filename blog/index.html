  <script>
    (function () {
      try {
        var t = localStorage.getItem("fr:theme");
        if (t && t !== "system") document.documentElement.setAttribute("data-theme", t);
        var l = localStorage.getItem("fr:lang");
        if (l) document.documentElement.lang = l;
      } catch (e) {}
    })();
  </script>

      </p>

      <div class="chips" id="topic-filters" role="group" aria-label="Topics"></div>

      <div class="posts" id="post-list"></div>

  </div>

  <script type="module" src="/js/pages/blog.js"></script>
